[package]
name = "runic-runtime"
description = "Native runtime for generated Runic applications: DOM operations, events, controls and window integration on Blitz"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["renderer-cpu"]
# D12: exactly one window renderer is linked; the project selects it in runic.json.
renderer-cpu = ["dep:anyrender_vello_cpu"]
renderer-gpu = ["dep:anyrender_vello"]
# Scripted input, DOM snapshots and screenshots for conformance runs.
probe = ["dep:anyrender_vello_cpu", "dep:png"]
# Inline SVG drawing (usvg, about 1.6 MiB); codegen enables it for programs
# with an `<svg>`.
svg = ["blitz-dom/svg", "blitz-paint/svg"]

[dependencies]
blitz-dom.workspace = true
blitz-shell.workspace = true
blitz-traits.workspace = true
blitz-paint.workspace = true
style_dom.workspace = true
# Computed styles (font stacks in diagnostics); the version Blitz uses.
style = { version = "=0.22.0", package = "stylo" }
style_traits = { version = "=0.22.0", package = "stylo_traits" }
anyrender.workspace = true
kurbo.workspace = true
peniko.workspace = true
anyrender_vello_cpu = { workspace = true, optional = true }
anyrender_vello = { workspace = true, optional = true }
winit.workspace = true
serde_json.workspace = true
base64.workspace = true
png = { workspace = true, optional = true }
keyboard-types.workspace = true
runic-js.workspace = true
runic-css.workspace = true
arboard.workspace = true
getrandom.workspace = true
