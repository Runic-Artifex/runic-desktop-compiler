[package]
name = "runic-js"
description = "JavaScript value semantics for generated Runic applications"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
indexmap = "=2.14.2"
url.workspace = true
regress = { version = "=0.12.0", default-features = false, features = ["std", "utf16"] }
# Time zones (Date local time): the IANA database bundled into the binary,
# so offsets do not depend on the host's zoneinfo files.
jiff = { version = "=0.2.37", default-features = false, features = ["std", "tzdb-bundle-always"] }
# Collation (localeCompare, Intl.Collator) with compiled CLDR data.
icu_collator = { version = "=2.3.1", default-features = false, features = ["compiled_data"] }
# The locale type icu_collator takes (already a dependency of it).
icu_locale_core = { version = "=2.3.0", default-features = false }

[dev-dependencies]
serde_json = { workspace = true }
