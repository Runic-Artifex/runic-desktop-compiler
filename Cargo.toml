[workspace]
resolver = "3"
members = [
    "crates/runic-js",
    "crates/runic-ir",
    "crates/runic-codegen",
    "crates/runic-runtime",
    "crates/runic-blitz-probes",
    "crates/runic-css",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[workspace.dependencies]
blitz-dom = { git = "file:///home/viktor/Development/RunicArtifex/blitz", rev = "e8dd36c6694be78902599320ab1653564627d128", default-features = false, features = ["woff"] }
blitz-html = { git = "file:///home/viktor/Development/RunicArtifex/blitz", rev = "e8dd36c6694be78902599320ab1653564627d128", default-features = false }
blitz-shell = { git = "file:///home/viktor/Development/RunicArtifex/blitz", rev = "e8dd36c6694be78902599320ab1653564627d128", default-features = false, features = ["data-uri"] }
# Element state bits for checkbox state changes (the version Blitz uses).
style_dom = { version = "=0.22.0", package = "stylo_dom" }
blitz-traits = { git = "file:///home/viktor/Development/RunicArtifex/blitz", rev = "e8dd36c6694be78902599320ab1653564627d128", default-features = false }
blitz-paint = { git = "file:///home/viktor/Development/RunicArtifex/blitz", rev = "e8dd36c6694be78902599320ab1653564627d128", default-features = false }
anyrender = "=0.14.0"
kurbo = "=0.13.1"
peniko = "=0.6.1"
# `backdrop_filters` (with `filters`): CSS `filter` lists and `backdrop-filter`
# in the CPU renderer, with the patched crates below.
anyrender_vello_cpu = { version = "=0.18.0", features = ["softbuffer_window_renderer", "backdrop_filters"] }
anyrender_vello = "=0.15.0"
winit = "=0.31.0-beta.3"
markup5ever = "=0.40.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"
base64 = "=0.22.1"
png = "=0.18.1"
keyboard-types = "=0.7.0"
# Host services (M5): history URLs, OS randomness and the OS clipboard.
url = "=2.5.8"
getrandom = "=0.4.3"
arboard = { version = "=3.6.1", default-features = false, features = ["wayland-data-control"] }
runic-js = { path = "crates/runic-js" }
runic-ir = { path = "crates/runic-ir" }
runic-runtime = { path = "crates/runic-runtime" }
runic-css = { path = "crates/runic-css" }

# The renderer forks (docs/research/M6-CPU-RENDERER.md): the published
# vello_cpu 0.3.0 and anyrender 0.14 releases plus colour-matrix filters, filter
# lists and backdrop filters in the CPU renderer (vello_cpu, anyrender_vello_cpu)
# and the GPU renderer (anyrender_vello over vello 0.11). The Stylo fork
# (docs/BLITZ-GAPS.md): the published stylo 0.22.0 (tag v0.22.0) plus
# cubic-bezier easing solved to Chromium's precision and a recascade when a
# style change cancels a CSS animation. Every crate of each repository in the
# graph is patched, so that crates.io and git copies are never mixed.
[patch.crates-io]
# Isolated raster-parity worktree at the existing Vello base 2a06f3e9.
# Replace local paths with reviewed pins before integration.
vello_cpu = { path = "/home/viktor/Development/RunicArtifex/vello-raster-parity/vello_cpu" }
vello_common = { path = "/home/viktor/Development/RunicArtifex/vello-raster-parity/vello_common" }
glifo = { path = "/home/viktor/Development/RunicArtifex/vello-raster-parity/glifo" }
vello = { path = "/home/viktor/Development/RunicArtifex/vello-raster-parity/research/vello_research" }
vello_encoding = { path = "/home/viktor/Development/RunicArtifex/vello-raster-parity/research/vello_encoding" }
vello_shaders = { path = "/home/viktor/Development/RunicArtifex/vello-raster-parity/research/vello_shaders" }
anyrender = { git = "file:///home/viktor/Development/RunicArtifex/anyrender", rev = "22b336b19938c911179e391ad19b34309493978c" }
anyrender_vello_cpu = { git = "file:///home/viktor/Development/RunicArtifex/anyrender", rev = "22b336b19938c911179e391ad19b34309493978c" }
anyrender_vello = { git = "file:///home/viktor/Development/RunicArtifex/anyrender", rev = "22b336b19938c911179e391ad19b34309493978c" }
anyrender_svg = { git = "file:///home/viktor/Development/RunicArtifex/anyrender", rev = "22b336b19938c911179e391ad19b34309493978c" }
softbuffer_window_renderer = { git = "file:///home/viktor/Development/RunicArtifex/anyrender", rev = "22b336b19938c911179e391ad19b34309493978c" }
wgpu_context = { git = "file:///home/viktor/Development/RunicArtifex/anyrender", rev = "22b336b19938c911179e391ad19b34309493978c" }
stylo = { path = "/home/viktor/Development/RunicArtifex/stylo-chromium-parity/style" }
stylo_atoms = { path = "/home/viktor/Development/RunicArtifex/stylo-chromium-parity/stylo_atoms" }
stylo_derive = { path = "/home/viktor/Development/RunicArtifex/stylo-chromium-parity/style_derive" }
stylo_dom = { path = "/home/viktor/Development/RunicArtifex/stylo-chromium-parity/stylo_dom" }
stylo_malloc_size_of = { path = "/home/viktor/Development/RunicArtifex/stylo-chromium-parity/malloc_size_of" }
stylo_static_prefs = { path = "/home/viktor/Development/RunicArtifex/stylo-chromium-parity/stylo_static_prefs" }
stylo_traits = { path = "/home/viktor/Development/RunicArtifex/stylo-chromium-parity/style_traits" }
selectors = { path = "/home/viktor/Development/RunicArtifex/stylo-chromium-parity/selectors" }
servo_arc = { path = "/home/viktor/Development/RunicArtifex/stylo-chromium-parity/servo_arc" }
to_shmem = { path = "/home/viktor/Development/RunicArtifex/stylo-chromium-parity/to_shmem" }
to_shmem_derive = { path = "/home/viktor/Development/RunicArtifex/stylo-chromium-parity/to_shmem_derive" }

# The Taffy fork (docs/BLITZ-GAPS.md): Blitz's Taffy revision plus a
# percentage flex basis against an indefinite main size used as `content`.
[patch."https://github.com/DioxusLabs/taffy"]
taffy = { git = "file:///home/viktor/Development/RunicArtifex/taffy", rev = "e7be3d5b2f58e3af868d90d18be6b96e89e1d8fb" }

[profile.dev]
debug = 0

# Same Parley revision, isolated weight-range matching repair.
[patch."https://github.com/linebender/parley"]
fontique = { path = "/home/viktor/Development/RunicArtifex/parley-chromium-parity/fontique" }
parley = { path = "/home/viktor/Development/RunicArtifex/parley-chromium-parity/parley" }
parlance = { path = "/home/viktor/Development/RunicArtifex/parley-chromium-parity/parlance" }
parley_engine = { path = "/home/viktor/Development/RunicArtifex/parley-chromium-parity/parley_engine" }
parley_data = { path = "/home/viktor/Development/RunicArtifex/parley-chromium-parity/parley_data" }
parley_emoji = { path = "/home/viktor/Development/RunicArtifex/parley-chromium-parity/parley_emoji" }

[profile.release]
opt-level = "s"
strip = true
debug = 0
codegen-units = 1
panic = "abort"

[patch."file:///home/viktor/Development/RunicArtifex/blitz"]
blitz-dom = { path = "/home/viktor/Development/RunicArtifex/blitz-tables/packages/blitz-dom" }
blitz-html = { path = "/home/viktor/Development/RunicArtifex/blitz-tables/packages/blitz-html" }
blitz-shell = { path = "/home/viktor/Development/RunicArtifex/blitz-tables/packages/blitz-shell" }
blitz-traits = { path = "/home/viktor/Development/RunicArtifex/blitz-tables/packages/blitz-traits" }
blitz-paint = { path = "/home/viktor/Development/RunicArtifex/blitz-tables/packages/blitz-paint" }
stylo_taffy = { path = "/home/viktor/Development/RunicArtifex/blitz-tables/packages/stylo_taffy" }
debug_timer = { path = "/home/viktor/Development/RunicArtifex/blitz-tables/packages/debug_timer" }
